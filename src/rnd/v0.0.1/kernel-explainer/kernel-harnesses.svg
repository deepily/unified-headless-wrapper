<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" role="img" aria-labelledby="ah3-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="ah3-title">How Claude Code, AGY and Jetski plug into the Lupin kernel</title>
  <style>
    .bg{fill:var(--d-bg,#fbfbfd)}
    .t{font-family:var(--d-font,'Public Sans',Helvetica,Arial,sans-serif);fill:var(--d-ink,#18202e)}
    .h{font-weight:700}
    .m{fill:var(--d-muted,#5b6475)}
    .mono{font-family:var(--d-mono,'JetBrains Mono',Menlo,monospace)}
    .kernel{fill:var(--d-kernel,#e9eefc);stroke:var(--d-kernel-line,#2f4fc4);stroke-width:2}
    .chip{fill:var(--d-card,#ffffff);stroke:var(--d-kernel-soft,#9fb0ea);stroke-width:1}
    .lupin{fill:var(--d-lupin,#e8f4ee);stroke:var(--d-lupin-line,#2c7a52);stroke-width:2}
    .lchip{fill:var(--d-card,#ffffff);stroke:var(--d-lupin-soft,#9ccbb2);stroke-width:1}
    .store{fill:var(--d-store,#fbf3e2);stroke:var(--d-store-line,#a8711a);stroke-width:1.5}
    .agent{fill:var(--d-agent,#f1f2f5);stroke:var(--d-agent-line,#4a5468);stroke-width:1.5}
    .person{fill:var(--d-card,#ffffff);stroke:var(--d-agent-line,#4a5468);stroke-width:1.5}
    .ln{stroke:var(--d-line,#4a5468);stroke-width:1.8;fill:none}
    .dash{stroke-dasharray:6 5}
    .badge{fill:var(--d-badge,#18202e)}
    .bt{font-family:var(--d-font,'Public Sans',Helvetica,Arial,sans-serif);fill:var(--d-badge-ink,#ffffff);font-weight:700}
    .arrowhead{fill:var(--d-line,#4a5468)}
  </style>
  <defs>
    <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" width="1100" height="650"/>
  <text class="t h" x="550" y="34" font-size="20" text-anchor="middle">Three harnesses, one kernel</text>
  <rect class="chip" x="186" y="52" width="290" height="26" rx="6"/>
  <text class="t" x="331" y="70" font-size="11.5" text-anchor="middle">Claude adapter · built last</text>
  <rect class="chip" x="484" y="52" width="588" height="26" rx="6"/>
  <text class="t" x="778" y="70" font-size="11.5" text-anchor="middle">Jetski-family adapter · one code path for both</text>
  <rect class="agent" x="186" y="86" width="290" height="40" rx="8"/>
  <text class="t h" x="331" y="112" font-size="15" text-anchor="middle">Claude Code</text>
  <rect class="agent" x="484" y="86" width="290" height="40" rx="8"/>
  <text class="t h" x="629" y="112" font-size="15" text-anchor="middle">AGY</text>
  <rect class="agent" x="782" y="86" width="290" height="40" rx="8"/>
  <text class="t h" x="927" y="112" font-size="15" text-anchor="middle">Jetski</text>
  <text class="t h" x="20" y="162" font-size="12.5" text-anchor="start">Launch</text>
  <rect class="chip" x="186" y="136" width="290" height="40" rx="6"/>
  <text class="t" x="198" y="153" font-size="11.5" text-anchor="start">claude -p, stream-json,</text>
  <text class="t m" x="198" y="168" font-size="11.5" text-anchor="start">user hooks isolated</text>
  <rect class="chip" x="484" y="136" width="290" height="40" rx="6"/>
  <text class="t" x="496" y="161" font-size="11.5" text-anchor="start">agy, stream-json</text>
  <rect class="chip" x="782" y="136" width="290" height="40" rx="6"/>
  <text class="t" x="794" y="161" font-size="11.5" text-anchor="start">jetski, stream-json</text>
  <text class="t h" x="20" y="208" font-size="12.5" text-anchor="start">Instructions</text>
  <rect class="chip" x="186" y="182" width="290" height="40" rx="6"/>
  <text class="t" x="198" y="199" font-size="11.5" text-anchor="start">system-prompt flag</text>
  <text class="t m" x="198" y="214" font-size="11.5" text-anchor="start">at every launch</text>
  <rect class="chip" x="484" y="182" width="290" height="40" rx="6"/>
  <text class="t" x="496" y="199" font-size="11.5" text-anchor="start">AGENTS.md in the</text>
  <text class="t m" x="496" y="214" font-size="11.5" text-anchor="start">agent's workspace</text>
  <rect class="chip" x="782" y="182" width="290" height="40" rx="6"/>
  <text class="t" x="794" y="199" font-size="11.5" text-anchor="start">AGENTS.md in the</text>
  <text class="t m" x="794" y="214" font-size="11.5" text-anchor="start">agent's workspace</text>
  <text class="t h" x="20" y="254" font-size="12.5" text-anchor="start">② Tool check</text>
  <rect class="chip" x="186" y="228" width="290" height="40" rx="6"/>
  <text class="t" x="198" y="245" font-size="11.5" text-anchor="start">PreToolUse hook,</text>
  <text class="t m" x="198" y="260" font-size="11.5" text-anchor="start">passed at launch</text>
  <rect class="chip" x="484" y="228" width="290" height="40" rx="6"/>
  <text class="t" x="496" y="245" font-size="11.5" text-anchor="start">.agents/hooks.json</text>
  <text class="t m" x="496" y="260" font-size="11.5" text-anchor="start">in the workspace</text>
  <rect class="chip" x="782" y="228" width="290" height="40" rx="6"/>
  <text class="t" x="794" y="245" font-size="11.5" text-anchor="start">.agents/hooks.json</text>
  <text class="t m" x="794" y="260" font-size="11.5" text-anchor="start">in the workspace</text>
  <text class="t h" x="20" y="300" font-size="12.5" text-anchor="start">① Lupin tools</text>
  <rect class="chip" x="186" y="274" width="290" height="40" rx="6"/>
  <text class="t" x="198" y="291" font-size="11.5" text-anchor="start">MCP config</text>
  <text class="t m" x="198" y="306" font-size="11.5" text-anchor="start">passed at launch</text>
  <rect class="chip" x="484" y="274" width="290" height="40" rx="6"/>
  <text class="t" x="496" y="291" font-size="11.5" text-anchor="start">~/.gemini/config/</text>
  <text class="t m" x="496" y="306" font-size="11.5" text-anchor="start">mcp_config.json</text>
  <rect class="chip" x="782" y="274" width="290" height="40" rx="6"/>
  <text class="t" x="794" y="291" font-size="11.5" text-anchor="start">~/.gemini/config/</text>
  <text class="t m" x="794" y="306" font-size="11.5" text-anchor="start">mcp_config.json</text>
  <text class="t h" x="20" y="346" font-size="12.5" text-anchor="start">Interrupt</text>
  <rect class="chip" x="186" y="320" width="290" height="40" rx="6"/>
  <text class="t" x="198" y="337" font-size="11.5" text-anchor="start">control message;</text>
  <text class="t m" x="198" y="352" font-size="11.5" text-anchor="start">process keeps running</text>
  <rect class="chip" x="484" y="320" width="290" height="40" rx="6"/>
  <text class="t" x="496" y="337" font-size="11.5" text-anchor="start">stop, then restart on</text>
  <text class="t m" x="496" y="352" font-size="11.5" text-anchor="start">the same conversation</text>
  <rect class="chip" x="782" y="320" width="290" height="40" rx="6"/>
  <text class="t" x="794" y="337" font-size="11.5" text-anchor="start">stop, then restart on</text>
  <text class="t m" x="794" y="352" font-size="11.5" text-anchor="start">the same conversation</text>
  <text class="t h" x="20" y="392" font-size="12.5" text-anchor="start">Message mid-turn</text>
  <rect class="chip" x="186" y="366" width="290" height="40" rx="6"/>
  <text class="t" x="198" y="391" font-size="11.5" text-anchor="start">joins the current turn</text>
  <rect class="chip" x="484" y="366" width="290" height="40" rx="6"/>
  <text class="t" x="496" y="391" font-size="11.5" text-anchor="start">waits for the next turn</text>
  <rect class="chip" x="782" y="366" width="290" height="40" rx="6"/>
  <text class="t" x="794" y="391" font-size="11.5" text-anchor="start">waits for the next turn</text>
  <text class="t h" x="20" y="438" font-size="12.5" text-anchor="start">Subagents</text>
  <rect class="chip" x="186" y="412" width="290" height="40" rx="6"/>
  <text class="t" x="198" y="437" font-size="11.5" text-anchor="start">gated by role</text>
  <rect class="chip" x="484" y="412" width="290" height="40" rx="6"/>
  <text class="t" x="496" y="429" font-size="11.5" text-anchor="start">gated by role; kernel</text>
  <text class="t m" x="496" y="444" font-size="11.5" text-anchor="start">can't see inside</text>
  <rect class="chip" x="782" y="412" width="290" height="40" rx="6"/>
  <text class="t" x="794" y="429" font-size="11.5" text-anchor="start">gated by role; kernel</text>
  <text class="t m" x="794" y="444" font-size="11.5" text-anchor="start">sees inside</text>
  <text class="t h" x="20" y="484" font-size="12.5" text-anchor="start">Long tool calls</text>
  <rect class="chip" x="186" y="458" width="290" height="40" rx="6"/>
  <text class="t" x="198" y="483" font-size="11.5" text-anchor="start">not measured yet</text>
  <rect class="chip" x="484" y="458" width="290" height="40" rx="6"/>
  <text class="t" x="496" y="475" font-size="11.5" text-anchor="start">cut at 180 s:</text>
  <text class="t m" x="496" y="490" font-size="11.5" text-anchor="start">asks use tickets</text>
  <rect class="chip" x="782" y="458" width="290" height="40" rx="6"/>
  <text class="t" x="794" y="475" font-size="11.5" text-anchor="start">cut at 180 s:</text>
  <text class="t m" x="794" y="490" font-size="11.5" text-anchor="start">asks use tickets</text>
  <line class="ln" x1="331" y1="504" x2="401.0" y2="546" marker-end="url(#ah3)"/>
  <line class="ln" x1="629" y1="504" x2="550.0" y2="546" marker-end="url(#ah3)"/>
  <line class="ln" x1="927" y1="504" x2="699.0" y2="546" marker-end="url(#ah3)"/>
  <rect class="kernel" x="240" y="548" width="620" height="58" rx="12"/>
  <text class="t h" x="550" y="572" font-size="15" text-anchor="middle">Lupin kernel</text>
  <text class="t m" x="550" y="592" font-size="12" text-anchor="middle">same registry, gate, inbox, narration and fleet view for every harness</text>
  <text class="t m" x="550" y="632" font-size="12" text-anchor="middle">The adapters absorb each harness's differences, so every agent looks the same to the kernel and to you.</text>

</svg>
