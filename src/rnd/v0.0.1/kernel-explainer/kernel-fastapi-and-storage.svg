<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" width="1100" height="510" role="img" aria-labelledby="ah4-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="ah4-title">The FastAPI services and storage around the Lupin kernel</title>
  <style>
    .bg{fill:var(--d-bg,#fbfbfd)}
    .t{font-family:var(--d-font,'Public Sans',Helvetica,Arial,sans-serif);fill:var(--d-ink,#18202e)}
    .h{font-weight:700}
    .m{fill:var(--d-muted,#5b6475)}
    .mono{font-family:var(--d-mono,'JetBrains Mono',Menlo,monospace)}
    .kernel{fill:var(--d-kernel,#e9eefc);stroke:var(--d-kernel-line,#2f4fc4);stroke-width:2}
    .chip{fill:var(--d-card,#ffffff);stroke:var(--d-kernel-soft,#9fb0ea);stroke-width:1}
    .lupin{fill:var(--d-lupin,#e8f4ee);stroke:var(--d-lupin-line,#2c7a52);stroke-width:2}
    .lchip{fill:var(--d-card,#ffffff);stroke:var(--d-lupin-soft,#9ccbb2);stroke-width:1}
    .store{fill:var(--d-store,#fbf3e2);stroke:var(--d-store-line,#a8711a);stroke-width:1.5}
    .agent{fill:var(--d-agent,#f1f2f5);stroke:var(--d-agent-line,#4a5468);stroke-width:1.5}
    .person{fill:var(--d-card,#ffffff);stroke:var(--d-agent-line,#4a5468);stroke-width:1.5}
    .ln{stroke:var(--d-line,#4a5468);stroke-width:1.8;fill:none}
    .dash{stroke-dasharray:6 5}
    .badge{fill:var(--d-badge,#18202e)}
    .bt{font-family:var(--d-font,'Public Sans',Helvetica,Arial,sans-serif);fill:var(--d-badge-ink,#ffffff);font-weight:700}
    .arrowhead{fill:var(--d-line,#4a5468)}
  </style>
  <defs>
    <marker id="ah4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" width="1100" height="510"/>
  <text class="t h" x="550" y="34" font-size="20" text-anchor="middle">The FastAPI services, before and after</text>
  <text class="t h" x="275" y="70" font-size="13" text-anchor="middle">TODAY</text>
  <text class="t h" x="825" y="70" font-size="13" text-anchor="middle">WITH THE KERNEL</text>
  <line class="ln dash" x1="550" y1="56" x2="550" y2="320"/>
  <rect class="lupin" x="20" y="86" width="250" height="210" rx="12"/>
  <text class="t h" x="145" y="112" font-size="14" text-anchor="middle">Lupin app · :7999</text>
  <text class="t m" x="145" y="132" font-size="11" text-anchor="middle">Docker · 37 routers</text>
  <text class="t h" x="40" y="162" font-size="12" text-anchor="start">9 routers agents call</text>
  <text class="t m" x="40" y="184" font-size="12" text-anchor="start">notifications · tasks · dm</text>
  <text class="t m" x="40" y="206" font-size="12" text-anchor="start">commons · asks · learner</text>
  <text class="t m" x="40" y="228" font-size="12" text-anchor="start">files · voice · transcript</text>
  <text class="t m" x="40" y="270" font-size="11" text-anchor="start">+ 28 routers for the UI and admin</text>
  <rect class="chip" x="290" y="86" width="240" height="100" rx="12"/>
  <text class="t h" x="410" y="112" font-size="14" text-anchor="middle">Arbiter · :8001</text>
  <text class="t m" x="410" y="134" font-size="11" text-anchor="middle">separate FastAPI service</text>
  <text class="t m" x="410" y="152" font-size="11" text-anchor="middle">fleet capacity and health</text>
  <rect class="agent" x="290" y="200" width="240" height="96" rx="12"/>
  <text class="t h" x="410" y="226" font-size="14" text-anchor="middle">AH4L harness</text>
  <text class="t m" x="410" y="248" font-size="11" text-anchor="middle">Claude Code only</text>
  <text class="t m" x="410" y="266" font-size="11" text-anchor="middle">calls both services directly</text>
  <rect class="lupin" x="570" y="86" width="250" height="210" rx="12"/>
  <text class="t h" x="695" y="112" font-size="14" text-anchor="middle">Lupin app · :7999</text>
  <text class="t m" x="695" y="132" font-size="11" text-anchor="middle">unchanged · system of record</text>
  <text class="t m" x="590" y="162" font-size="12" text-anchor="start">stays: notifications, tasks,</text>
  <text class="t m" x="590" y="184" font-size="12" text-anchor="start">DMs, commons, asks, learner,</text>
  <text class="t m" x="590" y="206" font-size="12" text-anchor="start">files, voice, speakerphone</text>
  <text class="t m" x="590" y="228" font-size="12" text-anchor="start">replaced: transcript and queue</text>
  <text class="t m" x="590" y="250" font-size="12" text-anchor="start">routers (to confirm)</text>
  <rect class="kernel" x="840" y="86" width="240" height="210" rx="12"/>
  <text class="t h" x="960" y="112" font-size="14" text-anchor="middle">Lupin kernel</text>
  <text class="t m" x="960" y="132" font-size="11" text-anchor="middle">FastAPI on a Unix socket</text>
  <text class="t mono" x="860" y="162" font-size="12" text-anchor="start">/gate (tool check)</text>
  <text class="t mono" x="860" y="184" font-size="12" text-anchor="start">/personas (CLI)</text>
  <text class="t mono" x="860" y="206" font-size="12" text-anchor="start">/personas/{id}/messages</text>
  <text class="t mono" x="860" y="228" font-size="12" text-anchor="start">/health (old arbiter)</text>
  <text class="t m" x="860" y="268" font-size="11" text-anchor="start">the arbiter folds in here</text>
  <line class="ln" x1="838" y1="190" x2="822" y2="190" marker-end="url(#ah4)"/>
  <text class="t m" x="830" y="312" font-size="11" text-anchor="middle">agents reach Lupin only through cosa-voice, gated by the kernel</text>
  <text class="t h" x="550" y="360" font-size="13" text-anchor="middle">WHERE THE DATA LIVES</text>
  <rect class="store" x="20" y="376" width="342" height="86" rx="10"/>
  <text class="t h" x="191" y="402" font-size="13" text-anchor="middle">PostgreSQL + pgvector</text>
  <text class="t m" x="191" y="424" font-size="11" text-anchor="middle">tasks, DMs, notifications, learner;</text>
  <text class="t m" x="191" y="442" font-size="11" text-anchor="middle">768-dim vectors (pgvector, v0.2.0)</text>
  <rect class="store" x="378" y="376" width="342" height="86" rx="10"/>
  <text class="t h" x="549" y="402" font-size="13" text-anchor="middle">io/ file tree</text>
  <text class="t m" x="549" y="424" font-size="11" text-anchor="middle">documents, audio, video, PDFs,</text>
  <text class="t m" x="549" y="442" font-size="11" text-anchor="middle">commons topics (io/commons/)</text>
  <rect class="store" x="736" y="376" width="342" height="86" rx="10"/>
  <text class="t h" x="907" y="402" font-size="13" text-anchor="middle">Kernel host disk</text>
  <text class="t m" x="907" y="424" font-size="11" text-anchor="middle">registry JSON, JSONL session</text>
  <text class="t m" x="907" y="442" font-size="11" text-anchor="middle">logs, agent workspaces</text>
  <text class="t m" x="370" y="488" font-size="11" text-anchor="middle">owned by the Lupin app (brokered by the kernel)</text>
  <text class="t m" x="907" y="488" font-size="11" text-anchor="middle">owned by the kernel</text>

</svg>
