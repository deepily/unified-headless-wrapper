<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" width="1100" height="740" role="img" aria-labelledby="ah1-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="ah1-title">The Lupin kernel and its four interfaces</title>
  <style>
    .bg{fill:var(--d-bg,#fbfbfd)}
    .t{font-family:var(--d-font,'Public Sans',Helvetica,Arial,sans-serif);fill:var(--d-ink,#18202e)}
    .h{font-weight:700}
    .m{fill:var(--d-muted,#5b6475)}
    .mono{font-family:var(--d-mono,'JetBrains Mono',Menlo,monospace)}
    .kernel{fill:var(--d-kernel,#e9eefc);stroke:var(--d-kernel-line,#2f4fc4);stroke-width:2}
    .chip{fill:var(--d-card,#ffffff);stroke:var(--d-kernel-soft,#9fb0ea);stroke-width:1}
    .lupin{fill:var(--d-lupin,#e8f4ee);stroke:var(--d-lupin-line,#2c7a52);stroke-width:2}
    .lchip{fill:var(--d-card,#ffffff);stroke:var(--d-lupin-soft,#9ccbb2);stroke-width:1}
    .store{fill:var(--d-store,#fbf3e2);stroke:var(--d-store-line,#a8711a);stroke-width:1.5}
    .agent{fill:var(--d-agent,#f1f2f5);stroke:var(--d-agent-line,#4a5468);stroke-width:1.5}
    .person{fill:var(--d-card,#ffffff);stroke:var(--d-agent-line,#4a5468);stroke-width:1.5}
    .ln{stroke:var(--d-line,#4a5468);stroke-width:1.8;fill:none}
    .dash{stroke-dasharray:6 5}
    .badge{fill:var(--d-badge,#18202e)}
    .bt{font-family:var(--d-font,'Public Sans',Helvetica,Arial,sans-serif);fill:var(--d-badge-ink,#ffffff);font-weight:700}
    .arrowhead{fill:var(--d-line,#4a5468)}
  </style>
  <defs>
    <marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" width="1100" height="740"/>
  <text class="t h" x="550" y="34" font-size="20" text-anchor="middle">The Lupin kernel and its four interfaces</text>
  <rect class="person" x="440" y="58" width="260" height="54" rx="10"/>
  <text class="t h" x="570" y="81" font-size="14" text-anchor="middle">Operators and scripts</text>
  <text class="t m mono" x="570" y="100" font-size="11" text-anchor="middle">lupin kernel status · persona spawn</text>
  <rect class="person" x="830" y="58" width="250" height="54" rx="10"/>
  <text class="t h" x="955" y="81" font-size="14" text-anchor="middle">You</text>
  <text class="t m" x="955" y="100" font-size="11" text-anchor="middle">voice · web · phone · console</text>
  <line class="ln" x1="570" y1="112" x2="570" y2="156" marker-end="url(#ah1)"/>
  <circle class="badge" cx="585" cy="134" r="10"/>
  <text class="bt" x="585" y="138" font-size="12" text-anchor="middle">4</text>
  <text class="t h" x="600" y="138" font-size="12" text-anchor="start">lupin CLI</text>
  <line class="ln" x1="955" y1="112" x2="955" y2="156" marker-end="url(#ah1)" marker-start="url(#ah1)"/>
  <text class="t m" x="966" y="138" font-size="11" text-anchor="start">your voice and text</text>
  <text class="t m h" x="20" y="160" font-size="11" text-anchor="start">AGENTS · one harness each</text>
  <rect class="agent" x="20" y="172" width="230" height="100" rx="10"/>
  <text class="t h" x="135" y="212" font-size="16" text-anchor="middle">Claude Code</text>
  <text class="t m" x="135" y="234" font-size="12" text-anchor="middle">Claude models</text>
  <line class="ln" x1="250" y1="222" x2="282" y2="222"/>
  <rect class="agent" x="20" y="302" width="230" height="100" rx="10"/>
  <text class="t h" x="135" y="342" font-size="16" text-anchor="middle">AGY</text>
  <text class="t m" x="135" y="364" font-size="12" text-anchor="middle">Gemini · Opus · Fable</text>
  <line class="ln" x1="250" y1="352" x2="282" y2="352"/>
  <rect class="agent" x="20" y="432" width="230" height="100" rx="10"/>
  <text class="t h" x="135" y="472" font-size="16" text-anchor="middle">Jetski</text>
  <text class="t m" x="135" y="494" font-size="12" text-anchor="middle">Gemini · Opus · Fable</text>
  <line class="ln" x1="250" y1="482" x2="282" y2="482"/>
  <line class="ln" x1="282" y1="222" x2="282" y2="606"/>
  <line class="ln" x1="282" y1="606" x2="252" y2="606" marker-end="url(#ah1)"/>
  <rect class="agent" x="20" y="568" width="230" height="76" rx="10"/>
  <circle class="badge" cx="42" cy="592" r="10"/>
  <text class="bt" x="42" y="596" font-size="12" text-anchor="middle">1</text>
  <text class="t h" x="58" y="597" font-size="14" text-anchor="start">cosa-voice MCP</text>
  <text class="t m" x="34" y="618" font-size="11" text-anchor="start">one per agent, started by the kernel</text>
  <text class="t m" x="34" y="634" font-size="11" text-anchor="start">the tools the model calls</text>
  <polyline class="ln" points="135,644 135,684 1092,684 1092,316 1082,316" marker-end="url(#ah1)"/>
  <text class="t m" x="610" y="676" font-size="11.5" text-anchor="middle">Lupin REST, unchanged endpoints · authenticated by API key · every call first allowed or denied by ②</text>
  <line class="ln" x1="282" y1="352" x2="418" y2="352" marker-end="url(#ah1)"/>
  <circle class="badge" cx="296" cy="334" r="10"/>
  <text class="bt" x="296" y="338" font-size="12" text-anchor="middle">2</text>
  <text class="t h" x="311" y="338" font-size="12" text-anchor="start">Hook shim</text>
  <text class="t m" x="296" y="370" font-size="11" text-anchor="start">may I run this tool?</text>
  <line class="ln dash" x1="282" y1="442" x2="418" y2="442" marker-end="url(#ah1)" marker-start="url(#ah1)"/>
  <text class="t h" x="296" y="430" font-size="12" text-anchor="start">engine stream</text>
  <text class="t m" x="296" y="460" font-size="11" text-anchor="start">turns in, replies out</text>
  <rect class="kernel" x="420" y="158" width="300" height="446" rx="14"/>
  <text class="t h" x="570" y="186" font-size="18" text-anchor="middle">Lupin kernel</text>
  <text class="t m" x="570" y="205" font-size="11" text-anchor="middle">owns the resources · makes every allow/deny call</text>
  <rect class="chip" x="436" y="220" width="130" height="34" rx="7"/>
  <text class="t" x="501" y="242" font-size="12" text-anchor="middle">Agent processes</text>
  <rect class="chip" x="574" y="220" width="130" height="34" rx="7"/>
  <text class="t" x="639" y="242" font-size="12" text-anchor="middle">Identity and roles</text>
  <rect class="chip" x="436" y="264" width="130" height="34" rx="7"/>
  <text class="t" x="501" y="286" font-size="12" text-anchor="middle">Conversations</text>
  <rect class="chip" x="574" y="264" width="130" height="34" rx="7"/>
  <text class="t" x="639" y="286" font-size="12" text-anchor="middle">Workspaces, config</text>
  <rect class="chip" x="436" y="308" width="130" height="34" rx="7"/>
  <text class="t" x="501" y="330" font-size="12" text-anchor="middle">Tool gate</text>
  <rect class="chip" x="574" y="308" width="130" height="34" rx="7"/>
  <text class="t" x="639" y="330" font-size="12" text-anchor="middle">Inbox router</text>
  <rect class="chip" x="436" y="352" width="130" height="34" rx="7"/>
  <text class="t" x="501" y="374" font-size="12" text-anchor="middle">Narration</text>
  <rect class="chip" x="574" y="352" width="130" height="34" rx="7"/>
  <text class="t" x="639" y="374" font-size="12" text-anchor="middle">Asks, escalation</text>
  <rect class="chip" x="436" y="396" width="130" height="34" rx="7"/>
  <text class="t" x="501" y="418" font-size="12" text-anchor="middle">Fleet health</text>
  <rect class="chip" x="574" y="396" width="130" height="34" rx="7"/>
  <text class="t" x="639" y="418" font-size="12" text-anchor="middle">Session logs</text>
  <rect class="store" x="436" y="448" width="268" height="66" rx="8"/>
  <text class="t h" x="570" y="472" font-size="12" text-anchor="middle">Kernel's own storage (host disk)</text>
  <text class="t m" x="570" y="492" font-size="11" text-anchor="middle">registry · session logs · workspaces</text>
  <text class="t m" x="570" y="548" font-size="11" text-anchor="middle">one per host · local API on a Unix socket</text>
  <text class="t m" x="570" y="566" font-size="11" text-anchor="middle">(serves ② ④; not a fifth interface)</text>
  <line class="ln" x1="722" y1="246" x2="828" y2="246" marker-end="url(#ah1)" marker-start="url(#ah1)"/>
  <circle class="badge" cx="736" cy="228" r="10"/>
  <text class="bt" x="736" y="232" font-size="12" text-anchor="middle">3</text>
  <text class="t h" x="751" y="232" font-size="12" text-anchor="start">Notifications</text>
  <text class="t m" x="736" y="264" font-size="11" text-anchor="start">socket per agent</text>
  <rect class="lupin" x="830" y="158" width="250" height="316" rx="14"/>
  <text class="t h" x="955" y="186" font-size="17" text-anchor="middle">Lupin application</text>
  <text class="t m" x="955" y="205" font-size="11" text-anchor="middle">FastAPI · port 7999 · system of record</text>
  <rect class="lchip" x="846" y="218" width="218" height="32" rx="7"/>
  <text class="t" x="955" y="239" font-size="12" text-anchor="middle">Notifications API + WebSocket</text>
  <rect class="lchip" x="846" y="258" width="218" height="32" rx="7"/>
  <text class="t" x="955" y="279" font-size="12" text-anchor="middle">Tasks</text>
  <rect class="lchip" x="846" y="298" width="218" height="32" rx="7"/>
  <text class="t" x="955" y="319" font-size="12" text-anchor="middle">DMs and commons</text>
  <rect class="lchip" x="846" y="338" width="218" height="32" rx="7"/>
  <text class="t" x="955" y="359" font-size="12" text-anchor="middle">Asks (tickets)</text>
  <rect class="lchip" x="846" y="378" width="218" height="32" rx="7"/>
  <text class="t" x="955" y="399" font-size="12" text-anchor="middle">Preference learner</text>
  <rect class="lchip" x="846" y="418" width="218" height="32" rx="7"/>
  <text class="t" x="955" y="439" font-size="12" text-anchor="middle">Files and documents</text>
  <line class="ln" x1="955" y1="474" x2="955" y2="506" marker-end="url(#ah1)"/>
  <rect class="store" x="830" y="508" width="122" height="82" rx="8"/>
  <text class="t h" x="891" y="532" font-size="12.5" text-anchor="middle">PostgreSQL</text>
  <text class="t m" x="891" y="553" font-size="10.5" text-anchor="middle">records, and vectors</text>
  <text class="t m" x="891" y="569" font-size="10.5" text-anchor="middle">via pgvector</text>
  <rect class="store" x="958" y="508" width="122" height="82" rx="8"/>
  <text class="t h" x="1019" y="532" font-size="12.5" text-anchor="middle">io/ files</text>
  <text class="t m" x="1019" y="553" font-size="10.5" text-anchor="middle">documents, audio,</text>
  <text class="t m" x="1019" y="569" font-size="10.5" text-anchor="middle">video, commons</text>
  <text class="t m" x="550" y="720" font-size="12" text-anchor="middle">① ② ③ ④ are the four interfaces. Agent requests go straight to Lupin through ①; the kernel authorizes each one through ②.</text>

</svg>
