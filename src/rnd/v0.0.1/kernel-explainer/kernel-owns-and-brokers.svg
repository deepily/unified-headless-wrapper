<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" width="1100" height="590" role="img" aria-labelledby="ah2-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="ah2-title">What the Lupin kernel owns and brokers</title>
  <style>
    .bg{fill:var(--d-bg,#fbfbfd)}
    .t{font-family:var(--d-font,'Public Sans',Helvetica,Arial,sans-serif);fill:var(--d-ink,#18202e)}
    .h{font-weight:700}
    .m{fill:var(--d-muted,#5b6475)}
    .mono{font-family:var(--d-mono,'JetBrains Mono',Menlo,monospace)}
    .kernel{fill:var(--d-kernel,#e9eefc);stroke:var(--d-kernel-line,#2f4fc4);stroke-width:2}
    .chip{fill:var(--d-card,#ffffff);stroke:var(--d-kernel-soft,#9fb0ea);stroke-width:1}
    .lupin{fill:var(--d-lupin,#e8f4ee);stroke:var(--d-lupin-line,#2c7a52);stroke-width:2}
    .lchip{fill:var(--d-card,#ffffff);stroke:var(--d-lupin-soft,#9ccbb2);stroke-width:1}
    .store{fill:var(--d-store,#fbf3e2);stroke:var(--d-store-line,#a8711a);stroke-width:1.5}
    .agent{fill:var(--d-agent,#f1f2f5);stroke:var(--d-agent-line,#4a5468);stroke-width:1.5}
    .person{fill:var(--d-card,#ffffff);stroke:var(--d-agent-line,#4a5468);stroke-width:1.5}
    .ln{stroke:var(--d-line,#4a5468);stroke-width:1.8;fill:none}
    .dash{stroke-dasharray:6 5}
    .badge{fill:var(--d-badge,#18202e)}
    .bt{font-family:var(--d-font,'Public Sans',Helvetica,Arial,sans-serif);fill:var(--d-badge-ink,#ffffff);font-weight:700}
    .arrowhead{fill:var(--d-line,#4a5468)}
  </style>
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" width="1100" height="590"/>
  <text class="t h" x="550" y="34" font-size="20" text-anchor="middle">What the kernel owns, and what it brokers</text>
  <rect class="agent" x="360" y="56" width="380" height="52" rx="10"/>
  <text class="t h" x="550" y="79" font-size="14" text-anchor="middle">Agents: Claude Code · AGY · Jetski</text>
  <text class="t m" x="550" y="98" font-size="11" text-anchor="middle">every tool call is checked by the kernel</text>
  <line class="ln" x1="550" y1="108" x2="550" y2="136" marker-end="url(#ah2)"/>
  <rect class="kernel" x="200" y="138" width="700" height="58" rx="12"/>
  <text class="t h" x="550" y="162" font-size="16" text-anchor="middle">Lupin kernel</text>
  <text class="t m" x="550" y="182" font-size="12" text-anchor="middle">checks role and rules on every call; serves owned resources itself, lets brokered calls through to Lupin</text>
  <line class="ln" x1="370" y1="196" x2="300" y2="236" marker-end="url(#ah2)"/>
  <line class="ln" x1="730" y1="196" x2="810" y2="236" marker-end="url(#ah2)"/>
  <rect class="kernel" x="20" y="238" width="520" height="300" rx="12"/>
  <text class="t h" x="40" y="266" font-size="13" text-anchor="start">OWNS</text>
  <text class="t m" x="92" y="266" font-size="12" text-anchor="start">the kernel decides and keeps the state</text>
  <text class="t h" x="40" y="292" font-size="12.5" text-anchor="start">Agent processes</text>
  <text class="t m" x="232" y="292" font-size="12" text-anchor="start">start, stop, interrupt, restart</text>
  <text class="t h" x="40" y="318" font-size="12.5" text-anchor="start">Identity and roles</text>
  <text class="t m" x="232" y="318" font-size="12" text-anchor="start">who is who, who reports to whom</text>
  <text class="t h" x="40" y="344" font-size="12.5" text-anchor="start">Conversations</text>
  <text class="t m" x="232" y="344" font-size="12" text-anchor="start">which one each agent resumes</text>
  <text class="t h" x="40" y="370" font-size="12.5" text-anchor="start">Workspaces and config</text>
  <text class="t m" x="232" y="370" font-size="12" text-anchor="start">folders, instructions, skills, tool allowances</text>
  <text class="t h" x="40" y="396" font-size="12.5" text-anchor="start">Tool use</text>
  <text class="t m" x="232" y="396" font-size="12" text-anchor="start">allow or deny every call</text>
  <text class="t h" x="40" y="422" font-size="12.5" text-anchor="start">Message routing</text>
  <text class="t m" x="232" y="422" font-size="12" text-anchor="start">start, queue, or interrupt</text>
  <text class="t h" x="40" y="448" font-size="12.5" text-anchor="start">Fleet capacity and health</text>
  <text class="t m" x="232" y="448" font-size="12" text-anchor="start">how many run, how healthy, how full</text>
  <text class="t h" x="40" y="474" font-size="12.5" text-anchor="start">Session logs</text>
  <text class="t m" x="232" y="474" font-size="12" text-anchor="start">a complete record per agent</text>
  <rect class="store" x="40" y="506" width="480" height="24" rx="6"/>
  <text class="t" x="280" y="522" font-size="11" text-anchor="middle">stored on the host: registry · session logs · workspaces</text>
  <rect class="lupin" x="560" y="238" width="520" height="300" rx="12"/>
  <text class="t h" x="580" y="266" font-size="13" text-anchor="start">BROKERS</text>
  <text class="t m" x="652" y="266" font-size="12" text-anchor="start">Lupin keeps the record; the kernel authorizes access</text>
  <text class="t h" x="580" y="292" font-size="12.5" text-anchor="start">Notifications</text>
  <text class="t m" x="752" y="292" font-size="12" text-anchor="start">narration out, your voice in</text>
  <text class="t h" x="580" y="318" font-size="12.5" text-anchor="start">Tasks</text>
  <text class="t m" x="752" y="318" font-size="12" text-anchor="start">the only source of owed work</text>
  <text class="t h" x="580" y="344" font-size="12.5" text-anchor="start">DMs and commons</text>
  <text class="t m" x="752" y="344" font-size="12" text-anchor="start">messages between agents</text>
  <text class="t h" x="580" y="370" font-size="12.5" text-anchor="start">Asks</text>
  <text class="t m" x="752" y="370" font-size="12" text-anchor="start">questions to you, with escalation</text>
  <text class="t h" x="580" y="396" font-size="12.5" text-anchor="start">Preference learner</text>
  <text class="t m" x="752" y="396" font-size="12" text-anchor="start">answers in your stead when you're away</text>
  <text class="t h" x="580" y="422" font-size="12.5" text-anchor="start">Files and documents</text>
  <text class="t m" x="752" y="422" font-size="12" text-anchor="start">artifacts that need a home</text>
  <rect class="store" x="580" y="456" width="235" height="74" rx="8"/>
  <text class="t h" x="697" y="486" font-size="13" text-anchor="middle">PostgreSQL + pgvector</text>
  <text class="t m" x="697" y="506" font-size="11" text-anchor="middle">records and vectors</text>
  <rect class="store" x="825" y="456" width="235" height="74" rx="8"/>
  <text class="t h" x="942" y="486" font-size="13" text-anchor="middle">io/ files</text>
  <text class="t m" x="942" y="506" font-size="11" text-anchor="middle">artifacts</text>
  <text class="t m" x="550" y="568" font-size="12" text-anchor="middle">Allocation and permission happen in the kernel either way. Brokered data simply lives in Lupin's databases and files.</text>

</svg>
