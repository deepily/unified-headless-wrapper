<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1040" height="640" fill="#ffffff"/>
  <text x="520" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">UHW: the Lupin kernel and its faces</text>

  <!-- kernel -->
  <rect x="250" y="70" width="540" height="200" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="520" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">Lupin kernel (host service, sole owner of state)</text>
  <g font-size="13" fill="#1e1b4b" text-anchor="middle">
    <rect x="272" y="114" width="156" height="38" rx="8" fill="#fff" stroke="#a5b4fc"/><text x="350" y="138">registry</text>
    <rect x="442" y="114" width="156" height="38" rx="8" fill="#fff" stroke="#a5b4fc"/><text x="520" y="138">inbox router</text>
    <rect x="612" y="114" width="156" height="38" rx="8" fill="#fff" stroke="#a5b4fc"/><text x="690" y="138">session processes</text>
    <rect x="272" y="162" width="156" height="38" rx="8" fill="#fff" stroke="#a5b4fc"/><text x="350" y="186">tool gate</text>
    <rect x="442" y="162" width="156" height="38" rx="8" fill="#fff" stroke="#a5b4fc"/><text x="520" y="186">turn-end policy</text>
    <rect x="612" y="162" width="156" height="38" rx="8" fill="#fff" stroke="#a5b4fc"/><text x="690" y="186">session log</text>
    <rect x="357" y="210" width="156" height="38" rx="8" fill="#fff" stroke="#a5b4fc"/><text x="435" y="228">fleet health</text><text x="435" y="243" font-size="11" fill="#6366f1">(today's arbiter)</text>
    <rect x="527" y="210" width="156" height="38" rx="8" fill="#fff" stroke="#a5b4fc"/><text x="605" y="234">task store client</text>
  </g>

  <!-- human face (left) -->
  <rect x="24" y="110" width="170" height="120" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="109" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#064e3b">Human + clients</text>
  <text x="109" y="164" text-anchor="middle" font-size="12" fill="#065f46">voice · console · web</text>
  <text x="109" y="196" text-anchor="middle" font-size="12" fill="#065f46">notifications API</text>
  <text x="109" y="212" text-anchor="middle" font-size="12" fill="#065f46">(WebSocket)</text>
  <line x1="196" y1="170" x2="246" y2="170" stroke="#475569" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="221" y="160" text-anchor="middle" font-size="11" fill="#334155">WS</text>

  <!-- operator CLI (right) -->
  <rect x="846" y="110" width="170" height="120" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="931" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#713f12">Operators + scripts</text>
  <text x="931" y="172" text-anchor="middle" font-size="13" fill="#854d0e" font-family="Menlo, monospace">lupin …</text>
  <text x="931" y="198" text-anchor="middle" font-size="12" fill="#854d0e">CLI over the</text>
  <text x="931" y="214" text-anchor="middle" font-size="12" fill="#854d0e">kernel API</text>
  <line x1="844" y1="170" x2="794" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="819" y="160" text-anchor="middle" font-size="11" fill="#334155">HTTP</text>

  <!-- three lower faces -->
  <g font-size="12">
    <!-- MCP -->
    <rect x="200" y="360" width="200" height="86" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <text x="300" y="390" text-anchor="middle" font-size="15" font-weight="700" fill="#0c4a6e">cosa-voice MCP</text>
    <text x="300" y="410" text-anchor="middle" fill="#075985">one per engine process</text>
    <text x="300" y="428" text-anchor="middle" fill="#075985">tools filtered by role</text>
    <!-- hook shim -->
    <rect x="420" y="360" width="200" height="86" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
    <text x="520" y="390" text-anchor="middle" font-size="15" font-weight="700" fill="#881337">hook shim</text>
    <text x="520" y="410" text-anchor="middle" fill="#9f1239">PreToolUse only,</text>
    <text x="520" y="428" text-anchor="middle" fill="#9f1239">one per engine family</text>
    <!-- engines -->
    <rect x="640" y="360" width="200" height="86" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="740" y="390" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">engine processes</text>
    <text x="740" y="410" text-anchor="middle" fill="#334155">Claude · Jetski · AGY</text>
    <text x="740" y="428" text-anchor="middle" fill="#334155">headless stream-json</text>
  </g>

  <!-- arrows to kernel -->
  <line x1="300" y1="356" x2="330" y2="274" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="252" y="318" font-size="11" fill="#334155">internal HTTP</text>
  <line x1="520" y1="356" x2="520" y2="274" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="528" y="318" font-size="11" fill="#334155">/gate</text>
  <text x="528" y="332" font-size="11" fill="#334155">(common call shape)</text>
  <line x1="740" y1="356" x2="710" y2="274" stroke="#475569" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="732" y="318" font-size="11" fill="#334155">stream-json stdin/stdout</text>

  <!-- model inside engine; engine to MCP and hook -->
  <rect x="660" y="500" width="160" height="56" rx="28" fill="#fff" stroke="#334155" stroke-dasharray="5 4" stroke-width="1.5"/>
  <text x="740" y="533" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">model</text>
  <line x1="740" y1="498" x2="740" y2="450" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="750" y="480" font-size="11" fill="#64748b">runs inside</text>
  <path d="M660,528 C430,560 300,520 300,450" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#a)"/>
  <text x="400" y="548" font-size="11" fill="#075985">tool calls (asks, DMs, tasks, fleet)</text>
  <path d="M672,512 C600,490 540,480 520,450" fill="none" stroke="#e11d48" stroke-width="2" marker-end="url(#a)"/>
  <text x="560" y="500" font-size="11" fill="#9f1239">every tool call vetted</text>

  <!-- spawn-time config -->
  <rect x="24" y="580" width="992" height="44" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="520" y="600" text-anchor="middle" font-size="12.5" fill="#334155">Spawn time, not an interface: persona manifest → rendered per engine (instructions, agent definition + tools, skills, hooks file, MCP config)</text>
  <text x="520" y="616" text-anchor="middle" font-size="12.5" fill="#334155">+ env: LUPIN_PERSONA_ID, kernel URL</text>
</svg>
